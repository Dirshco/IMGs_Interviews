<!DOCTYPE html>
<html>
<head>
    <title>AI Simulator Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3"></script>
    <style>
        /* Minimal styles to fit inside a Glide Embed */
        body { font-family: sans-serif; margin: 0; background: #000; color: #fff; overflow: hidden; }
        #webcam { width: 100%; height: 100vh; object-fit: cover; transform: scaleX(-1); }
        .overlay { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
        .nudge { display: none; background: rgba(239, 68, 68, 0.9); padding: 10px; border-radius: 20px; }
        .controls { position: absolute; bottom: 20px; width: 90%; left: 5%; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        #transcript { position: absolute; bottom: 85px; width: 90%; left: 5%; background: rgba(0,0,0,0.6); font-size: 12px; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline></video>
    <div class="overlay"><div id="nudge" class="nudge">⚠️ ADJUST POSTURE / EYE CONTACT</div></div>
    <div id="transcript">Listening...</div>
    <div class="controls">
        <button id="actionBtn" class="btn" style="background: #10b981; color: white;" onclick="toggleSession()">START PRACTICE</button>
    </div>

    <script type="module">
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";
        let isRunning = false;
        let stats = { eye: 0, posture: 0, frames: 0 };
        let faceLandmarker;
        let baselineY = null;
        const WEBHOOK_URL = "PASTE_YOUR_GLIDE_WEBHOOK_URL_HERE";

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task` },
                runningMode: "VIDEO", numFaces: 1
            });
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('webcam').srcObject = stream;
            loop();
        }

        async function loop() {
            if (isRunning && faceLandmarker) {
                const result = faceLandmarker.detectForVideo(document.getElementById('webcam'), performance.now());
                if (result.faceLandmarks?.[0]) {
                    stats.frames++;
                    const nose = result.faceLandmarks[0][1];
                    if (!baselineY) baselineY = nose.y;
                    const bad = Math.abs(nose.x - 0.5) > 0.12 || nose.y > (baselineY + 0.08);
                    document.getElementById('nudge').style.display = bad ? 'block' : 'none';
                    if (!bad) { stats.eye++; stats.posture++; }
                }
            }
            requestAnimationFrame(loop);
        }

        window.toggleSession = async () => {
            if (!isRunning) {
                isRunning = true;
                baselineY = null;
                document.getElementById('actionBtn').innerText = "STOP & ANALYZE";
                document.getElementById('actionBtn').style.background = "#ef4444";
                startSpeech();
            } else {
                isRunning = false;
                document.getElementById('actionBtn').innerText = "SENDING...";
                await sendToGlide();
                document.getElementById('actionBtn').innerText = "SENT! REFRESHING...";
                setTimeout(() => location.reload(), 2000);
            }
        };

        async function sendToGlide() {
            const params = new URLSearchParams(window.location.search);
            await fetch(WEBHOOK_URL, {
                method: "POST",
                body: JSON.stringify({
                    userId: params.get('userId'),
                    specialty: params.get('specialty'),
                    transcript: document.getElementById('transcript').innerText,
                    eyeScore: Math.round((stats.eye / stats.frames) * 100)
                })
            });
        }

        function startSpeech() {
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            const rec = new Speech();
            rec.continuous = true;
            rec.onresult = (e) => {
                let str = "";
                for (let i = 0; i < e.results.length; i++) str += e.results[i][0].transcript;
                document.getElementById('transcript').innerText = str;
            };
            rec.start();
        }
        init();
    </script>
</body>
</html>
